version: "3.9"

services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - data-mesh-local

  localstack:
    image: localstack/localstack:3.8.0
    container_name: localstack
    environment:
      SERVICES: glue,iam,sts,s3
      DEBUG: 1
      AWS_DEFAULT_REGION: eu-west-1
      EDGE_PORT: 4566
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - data-mesh-local

  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./:/opt/project
    depends_on:
      minio:
        condition: service_started
      localstack:
        condition: service_started
    networks:
      - data-mesh-local

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    ports:
      - "8081:8081"
    volumes:
      - ./:/opt/project
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - data-mesh-local

  trino:
    image: trinodb/trino:462
    container_name: trino
    ports:
      - "8088:8080"
    volumes:
      - ./:/opt/project
      - ./queries:/opt/project/queries
      - ./trino/catalog:/etc/trino/catalog # Vital para conectar con MinIO y Glue
    depends_on:
      minio:
        condition: service_started
      localstack:
        condition: service_started
    networks:
      - data-mesh-local

networks:
  data-mesh-local:
    name: data-mesh-local
    driver: bridge

volumes:
  minio-data:
  localstack-data:
